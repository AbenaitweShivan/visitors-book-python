{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-semibold mb-4">Reception login</h1>
  {% if error %}
  <p class="mb-4 text-red-700 bg-red-100 rounded px-3 py-2">{{ error }}</p>
  {% endif %}
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input name="email" type="email" placeholder="Email" required class="w-full border rounded px-3 py-2">
    <input name="password" type="password" placeholder="Password" required class="w-full border rounded px-3 py-2">
    <button class="w-full bg-blue-900 text-white rounded py-2 hover:bg-blue-800">Log in</button>
  </form>
</div>
{% endblock %}
