<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Visitors Book{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  {% if session.user_id %}
  <nav class="bg-blue-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap gap-4 items-center">
      <span class="font-semibold">Visitors Book</span>
      <a href="{{ url_for('index') }}" class="hover:underline">Today</a>
      <a href="{{ url_for('checkin') }}" class="hover:underline">Check in</a>
      <a href="{{ url_for('search') }}" class="hover:underline">Search</a>
      <span class="ml-auto text-sm">{{ session.user_name }}</span>
      <a href="{{ url_for('logout') }}" class="text-sm hover:underline">Log out</a>
    </div>
  </nav>
  {% endif %}
  <main class="max-w-6xl mx-auto px-4 py-6">
    {% for message in get_flashed_messages() %}
    <div class="mb-4 rounded bg-green-100 text-green-800 px-4 py-3">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
